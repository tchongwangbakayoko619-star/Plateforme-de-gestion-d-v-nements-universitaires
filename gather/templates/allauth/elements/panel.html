{% load allauth %}

<section class="mb-6">
  <h2 class="font-display text-xl text-primary-600 mb-4">
    {% slot title %}
    {% endslot %}
  </h2>
  <div class="space-y-4">
    {% slot body %}
    {% endslot %}
  </div>
  {% if slots.actions %}
    <div class="mt-5 flex flex-wrap gap-3">{% for action in slots.actions %}{{ action }}{% endfor %}</div>
  {% endif %}
</section>

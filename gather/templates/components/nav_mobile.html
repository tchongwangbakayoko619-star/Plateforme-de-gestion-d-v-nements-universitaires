{% load i18n %}

<nav data-mobile-nav
     class="fixed inset-x-0 bottom-0 z-50 border-t border-primary-100 bg-paper/95 backdrop-blur-sm md:hidden"
     aria-label="{% translate 'Navigation principale' %}">
  <div class="grid {% if user.is_authenticated %}grid-cols-5{% else %}grid-cols-3{% endif %} max-w-md mx-auto"
       style="padding-bottom: env(safe-area-inset-bottom)">
    <a href="/"
       class="flex flex-col items-center gap-1 px-2 py-2 text-[0.7rem] font-medium text-primary-600 hover:text-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-600">
      <svg viewBox="0 0 24 24"
           fill="none"
           class="w-5 h-5"
           stroke="currentColor"
           stroke-width="1.8"
           aria-hidden="true">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
      </svg>
      <span>{% translate "Accueil" %}</span>
    </a>
    <a href="{% url 'events:list' %}"
       class="flex flex-col items-center gap-1 px-2 py-2 text-[0.7rem] font-medium text-primary-600 hover:text-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-600">
      <svg viewBox="0 0 24 24"
           fill="none"
           class="w-5 h-5"
           stroke="currentColor"
           stroke-width="1.8"
           aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M8 3v4M16 3v4M3 10h18" />
      </svg>
      <span>{% translate "Événements" %}</span>
    </a>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard:redirect' %}"
         class="flex flex-col items-center gap-1 px-2 py-2 text-[0.7rem] font-medium text-primary-600 hover:text-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-600">
        <svg viewBox="0 0 24 24"
             fill="none"
             class="w-5 h-5"
             stroke="currentColor"
             stroke-width="1.8"
             aria-hidden="true">
          <rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" />
        </svg>
        <span>{% translate "Tableau de bord" %}</span>
      </a>
      <a href="{% url 'notifications:liste' %}"
         class="relative flex flex-col items-center gap-1 px-2 py-2 text-[0.7rem] font-medium text-primary-600 hover:text-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-600">
        <svg viewBox="0 0 24 24"
             fill="none"
             class="w-5 h-5"
             stroke="currentColor"
             stroke-width="1.8"
             aria-hidden="true">
          <path d="M18 10a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 22h4" />
        </svg>
        <span id="badge-notifications"
              class="hidden absolute -top-1 right-3 min-w-[1.35rem] h-5 px-1.5 rounded-full bg-gold text-[0.65rem] font-semibold text-primary-950 leading-5 text-center border border-paper"></span>
        <span>{% translate "Alertes" %}</span>
      </a>
      <a href="{% url 'users:profile' %}"
         class="relative flex flex-col items-center gap-1 px-2 py-2 text-[0.7rem] font-medium text-primary-600 hover:text-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-600">
        <svg viewBox="0 0 24 24"
             fill="none"
             class="w-5 h-5"
             stroke="currentColor"
             stroke-width="1.8"
             aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5 21c.8-4 3.2-6 7-6s6.2 2 7 6" />
        </svg>
        <span>{% translate "Profil" %}</span>
      </a>
    {% else %}
      <a href="{% url 'account_login' %}"
         class="flex flex-col items-center gap-1 px-2 py-2 text-[0.7rem] font-medium text-primary-600 hover:text-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-600">
        <svg viewBox="0 0 24 24"
             fill="none"
             class="w-5 h-5"
             stroke="currentColor"
             stroke-width="1.8"
             aria-hidden="true">
          <path d="M10 17l5-5-5-5M15 12H3" />
          <path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5" />
        </svg>
        <span>{% translate "Connexion" %}</span>
      </a>
    {% endif %}
  </div>
</nav>
